{% extends 'base.html' %}{% block content %}<div class="page-head"><p class="eyebrow">JEWELRY PLANNER</p><h1>Jewelry Budget Planner</h1><p>Describe the occasion and style. Optionally upload an outfit image for multimodal matching.</p></div><form id="jewelryForm" class="panel formgrid" enctype="multipart/form-data"><label>Total budget (₹)<input type="number" name="budget" min="1" required></label><label>Occasion<input name="occasion" placeholder="Wedding / Party / Office" required></label><label>Style<input name="style" placeholder="Minimal / Traditional / Statement" required></label><label class="full">Outfit description<textarea name="outfit_description" placeholder="Blue saree with gold border"></textarea></label><label class="full">Outfit image <input type="file" name="outfit" accept="image/jpeg,image/png,image/webp"></label><button class="btn full">Generate Recommendations</button></form><div id="result"></div>{% endblock %}{% block scripts %}<script>requireAuth();document.querySelector('#jewelryForm').addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.target);const r=await apiMultipart('/api/planners/jewelry',f);renderResult('#result',r.jewelry||r,r.source);});</script>{% endblock %}
