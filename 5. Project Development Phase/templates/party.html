{% extends 'base.html' %}{% block content %}<div class="page-head"><p class="eyebrow">PARTY PLANNER</p><h1>Party Budget Planner</h1><p>Allocate your event budget across catering, venue, décor and entertainment.</p></div><form id="partyForm" class="panel formgrid"><label>Total budget (₹)<input type="number" name="budget" min="1" required></label><label>Guest count<input type="number" name="guests" min="1" required></label><label>Event type<input name="event_type" placeholder="Birthday / Wedding / Corporate" required></label><label>Venue details<input name="venue" placeholder="Banquet hall / Home / Outdoor" required></label><label class="full">Preferences<textarea name="preferences" placeholder="Vegetarian food, elegant décor, etc."></textarea></label><button class="btn full">Generate Recommendations</button></form><div id="result"></div>{% endblock %}{% block scripts %}<script>requireAuth();document.querySelector('#partyForm').addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.target);const body={budget:Number(f.get('budget')),guests:Number(f.get('guests')),event_type:f.get('event_type'),venue:f.get('venue'),preferences:f.get('preferences')||'balanced'};const r=await api('/api/planners/party','POST',body);renderResult('#result',r.party||r,r.source);});</script>{% endblock %}
