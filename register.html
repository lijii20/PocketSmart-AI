{% extends 'base.html' %}{% block content %}<div class="auth"><form id="registerForm" class="panel"><h1>Create your account</h1><label>Username<input name="username" minlength="3" required></label><label>Email<input type="email" name="email" required></label><label>Password<input type="password" name="password" minlength="6" required></label><label>Confirm Password<input type="password" name="confirm_password" minlength="6" required></label><button class="btn">Create Account</button><div id="msg"></div><p>Already registered? <a href="/login">Sign in</a></p></form></div>{% endblock %}{% block scripts %}<script>document.querySelector('#registerForm').addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.target);const r=await api('/api/auth/register','POST',Object.fromEntries(f));if(r.token){localStorage.setItem('token',r.token);localStorage.setItem('username',r.username);location.href='/dashboard'}else document.querySelector('#msg').textContent=JSON.stringify(r.detail||r)});</script>{% endblock %}
