{% extends 'base.html' %}{% block content %}<div class="page-head"><p class="eyebrow">HOME INTERIOR</p><h1>Home Interior Budget Planner</h1><p>Define your room, style and shopping list.</p></div><form id="homeForm" class="panel formgrid"><label>Total budget (₹)<input type="number" name="budget" min="1" required></label><label>Room type<input name="room_type" placeholder="Living Room" required></label><label>Style<input name="style" placeholder="Modern" required></label><div class="full"><h3>Items</h3><div id="items"></div><button type="button" class="btn secondary" onclick="addHomeItem()">+ Add item</button></div><button class="btn full">Generate Recommendations</button></form><div id="result"></div>{% endblock %}{% block scripts %}<script>requireAuth();let n=0;function addHomeItem(cat='',qty=1){n++;document.querySelector('#items').insertAdjacentHTML('beforeend',`<div class="itemrow"><input name="cat" placeholder="e.g. Ceiling fans" value="${cat}" required><input type="number" name="qty" min="1" value="${qty}" required><button type="button" onclick="this.parentElement.remove()">×</button></div>`)}addHomeItem('Lights',2);addHomeItem('Ceiling fans',1);document.querySelector('#homeForm').addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.target);const cats=[...document.querySelectorAll('[name=cat]')],qty=[...document.querySelectorAll('[name=qty]')];const body={budget:Number(f.get('budget')),room_type:f.get('room_type'),style:f.get('style'),items:cats.map((x,i)=>({category:x.value,quantity:Number(qty[i].value),style:f.get('style')}))};const r=await api('/api/planners/home','POST',body);renderResult('#result',r.home||r, r.source);});</script>{% endblock %}
