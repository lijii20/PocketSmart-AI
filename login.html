{% extends 'base.html' %}{% block content %}<div class="auth"><form id="loginForm" class="panel"><h1>Welcome back</h1><p>Sign in to your PocketSmart account.</p><label>Username<input name="username" required></label><label>Password<input type="password" name="password" required></label><button class="btn">Sign In</button><div id="msg"></div><p>New here? <a href="/register">Create account</a></p></form></div>{% endblock %}{% block scripts %}<script>document.querySelector('#loginForm').addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.target);const r=await api('/api/auth/login','POST',Object.fromEntries(f));if(r.token){localStorage.setItem('token',r.token);localStorage.setItem('username',r.username);location.href='/dashboard'}else document.querySelector('#msg').textContent=r.detail||'Login failed'});</script>{% endblock %}
